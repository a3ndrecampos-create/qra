name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK - Restaurante
        run: gradle :restaurant:assembleDebug --no-daemon

      - name: Build APK - Motoboy
        run: gradle :motoboy:assembleDebug --no-daemon

      - name: Upload APK - Restaurante
        uses: actions/upload-artifact@v4
        with:
          name: RotaCerta-Restaurante-debug-apk
          path: restaurant/build/outputs/apk/debug/restaurant-debug.apk

      - name: Upload APK - Motoboy
        uses: actions/upload-artifact@v4
        with:
          name: RotaCerta-Motoboy-debug-apk
          path: motoboy/build/outputs/apk/debug/motoboy-debug.apk
